name: "Agent DVR"
description: "A simple module to integrate Agent DVR as an HA addon"
version: "0.1.0"
slug: "agentdvr"
url: https://github.com/tetram/ha-addons/tree/main/agentdvr
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - i386
  - armv7
host_network: true
volumes:
  data:
    path: share/agentdvr
    description: Persist agentdvr data
options:
  timezone: 'Europe/Paris'
  webui_port: 8090
schema:
  timezone: str
  webui_port: port
