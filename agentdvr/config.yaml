name: "Agent DVR"
description: "A simple module to integrate Agent DVR as an HA addon"
version: "0.1.0"
slug: "agentdvr"
url: https://github.com/tetram/ha-addons/tree/main/agentdvr
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - i386
  - armv7
host_network: true
volumes:
  config:
    path: share/agentdvr/config
    container_path: /AgentDVR/Media/XML
    description: "AgentDVR configs"
  recordings:
    path: share/agentdvr/recordings
    container_path: /AgentDVR/Media/WebServerRoot/Media
    description: "Saved recordings"
  models:
    path: share/agentdvr/models
    container_path: /AgentDVR/Media/Models
    description: "AI models"
  commands:
    path: share/agentdvr/commands
    container_path: /AgentDVR/Commands
    description: "Custom commands"
options:
  timezone: 'Europe/Paris'
  webui_port: 8090
schema:
  timezone: str
  webui_port: port
